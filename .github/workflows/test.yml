# テスト: push / PR 時に rspec + rubocop を実行。
#
# 本 gem のテストはクラスタ不要（§9・transport スタブ注入）なので
# runner は ubuntu-latest + Ruby のみ。kind / 実クラスタ E2E は
# v0.2 の CI 化対象（設計書 §9・§10）で、v0.1 では手動検証（§12）。
name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec-rubocop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gemspec の宣言範囲（>= 3.3, < 4.0）をカバーする 3 系統:
        # 3.3.0 = 宣言下限（kruby 1.36.x の required_ruby_version、実測
        # 2026-09-21）、3.3.8 = 開発バージョン（.ruby-version）、
        # 3.4.10 = 3.x 系の最新 stable（2026-09-21 時点。Ruby 3.5 は
        # preview で stable 化していない、4.0 は宣言範囲外）。
        # stable 化された新 3.x minor が出たら matrix に追加すること
        # （4.x は宣言範囲外のため対象外）。
        ruby: ["3.3.0", "3.3.8", "3.4.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run rspec + rubocop
        run: bundle exec rake
# matrix は「宣言された下限（3.3.0 = kruby 1.36.x の required_ruby_version）」と
# 開発バージョン（.ruby-version の 3.3.8）。下限を飛ばすと宣言と検証がズレる。
