# テスト: push / PR 時に rspec + rubocop を実行。
#
# 本 gem のテストはクラスタ不要（§9・transport スタブ注入）なので
# runner は ubuntu-latest + Ruby のみ。kind / 実クラスタ E2E は
# v0.3 の CI 化対象（設計書 §9・§10）で、v0.1 では手動検証（§12）。
name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec-rubocop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gemspec の宣言範囲（>= 3.3, < 5.0）をカバーする 4 系統:
        # 3.3.0 = 宣言下限（kruby 1.36.x の required_ruby_version、実測
        # 2026-09-21）、3.3.8 = 開発バージョン（.ruby-version）、
        # 3.4.10 = 3.x 系の最新 stable、4.0.7 = 4.x の最新 stable
        # （2026-09-22 にローカル Ruby 4.0.7 上で全 suite / rubocop 検証済み）。
        # Ruby 3.5 は preview（v3_5_0_preview1）で宣言範囲外。
        # stable 化された新 minor（3.5 以降 / 4.x 新 patch 等）が出たら
        # matrix に追加すること（宣言範囲 = 検証範囲・設計書 §13）。
        ruby: ["3.3.0", "3.3.8", "3.4.10", "4.0.7"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run rspec + rubocop
        run: bundle exec rake
# matrix は「宣言された下限（3.3.0 = kruby 1.36.x の required_ruby_version）」と
# 開発バージョン（.ruby-version の 3.3.8）。下限を飛ばすと宣言と検証がズレる。
