# テスト: push / PR 時に 2 つのジョブを実行（#34・設計書 §9）。
#
# - rspec-rubocop: クラスタ不要の rspec + rubocop マトリクス（単体層 +
#   実 kruby トランスポートのループバック層を含む。runner は ubuntu-latest + Ruby のみ）。
# - e2e-kind: 隔離 kind クラスタでの実 E2E（scripts/e2e_kind.rb + `rake e2e`）。
#   実クラスタ経路（接続・認証ヘッダー・CRUD・削除レスポンス形状）を検証する。
#   スクリプトのガードが `kind-*` コンテキスト以外での実行を拒否するため、
#   個人 kubeconfig は決して対象にならない。
name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec-rubocop:
    # ubuntu-latest moved to ubuntu-26.04 (2026-11), which builds only the
    # latest patch of each Ruby series. The matrix below pins exact patch
    # versions ON PURPOSE (3.3.0 = the declared floor, kruby's
    # required_ruby_version; design §13: declared range = tested range), so
    # the runner image is pinned to the image where those builds exist.
    # Revisit when the matrix itself drops the floor pins.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # gemspec の宣言範囲（>= 3.3, < 4.1）で公開済みの Ruby を
        # 系統ごとに検証（2026-09-22 時点・ruby/ruby タグ実測、この範囲に
        # 残る公開リリースは以下のみ）:
        # 3.3.0 = 宣言下限（kruby 1.36.x の required_ruby_version、実測
        # 2026-09-21）、3.3.8 = 開発バージョン（.ruby-version）、
        # 3.4.10 = 3.4 系の最新 stable、3.5.0-preview1 = 3.5 系の唯一の
        # 公開リリース、4.0.7 = 4.0 系の最新 stable。3.5.0-preview1 と
        # 4.0.7 は 2026-09-22 にローカルで全 suite / rubocop 検証済み。
        # Ruby 4.1.0-preview1（2026-10-17 公開）は `!= 4.1.0.preview1` で
        # 宣言区間から除外（#41・PR #42 レビュー指摘）: Gem.ruby_version は
        # prerelease 形式 4.1.0.preview1 を報告し < 4.1 単独では除外されない
        # （実測）。preview1 環境で bundle install が RubyGems/Bundler 既知の
        # uninitialized constant Pathname::SEPARATOR_PAT（Bundler 4.0.23 でも
        # 再現・ローカル実測 2026-10-17）で失敗し、検証基盤が動かない。
        # rubygems 修正後または 4.1 stable リリース時に除外を外して追加する。
        # != は 1 バージョンのみ除外のため、将来の preview
        # （4.1.0.preview2 等）はその都度追加する（#41）。
        # stable 化された新 minor（3.5 stable / 4.1 系等）が出たら
        # matrix に追加する（宣言範囲 = 検証範囲・設計書 §13）。
        ruby: ["3.3.0", "3.3.8", "3.4.10", "3.5.0-preview1", "4.0.7"]
    steps:
      - uses: actions/checkout@v4
      # 3.5.0-preview1 シェードのみの前処理: ffi のプリコンパイル platform
      # gem には 3.5 preview 対応バイナリが存在しない（LoadError: cannot load
      # such file -- 3.5/ffi_c）。ffi を source ビルドさせる（BUNDLE_FORCE_RUBY_PLATFORM）
      # ために libffi-dev を保証する。
      - name: Install libffi-dev (ffi source build for preview Ruby)
        if: matrix.ruby == '3.5.0-preview1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libffi-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          # 3.5.0-preview1 のみ ruby platform（source ビルド）で ffi を組む。
          # 他シェードは空（既定の platform gem 使用）。
          BUNDLE_FORCE_RUBY_PLATFORM: ${{ matrix.ruby == '3.5.0-preview1' && '1' || '' }}
      - name: Run rspec + rubocop
        run: bundle exec rake

  e2e-kind:
    # 隔離 kind クラスタでの実 E2E（#34・設計書 §9）。rspec + rubocop
    # マトリクスとは役割が異なる: こちらは実クラスタ経路（接続・認証・CRUD・
    # 削除レスポンス形状・後処理）を検証する。Ruby は開発バージョン
    # （3.3.8）のみ — 他の Ruby 系統は rspec マトリクスで担保する。
    # helm/kind-action は kind と kubectl をインストールする（公式ドキュメント
    # の推奨導線）。kubeconfig は明示パスに書き出し、`rake e2e` 実行時の
    # KUBECONFIG で同じファイルを kubectl（ガード）と kruby（接続解決）が共有する。
    # 同じ理由で runner image を固定（3.3.8 は ubuntu-26.04 のビルド対象外）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: k8s-rails-e2e
          kubeconfig: /tmp/k8s-rails-e2e-kubeconfig
      - name: Run kind E2E
        run: bundle exec rake e2e
        env:
          KUBECONFIG: /tmp/k8s-rails-e2e-kubeconfig
# matrix は「宣言された下限（3.3.0 = kruby 1.36.x の required_ruby_version）」と
# 開発バージョン（.ruby-version の 3.3.8）。下限を飛ばすと宣言と検証がズレる。
