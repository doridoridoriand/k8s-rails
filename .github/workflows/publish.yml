# 公開: タグ `v*` を push したら gem build + gem push（RubyGems）を自動実行。
#
# **publish のゲート**: 公開前に `verify` job（サポート Ruby 全バージョンの
# rake）が成功したことのみに push job が依存する。独立した Test workflow は
# 並列で完結するため、tag push の瞬間に失敗してもこの workflow の gem push
# をブロックできない（そのため本 workflow 内に前提テストを置く）。
#
# 公開は v0.1 完成後、タグ基準で行う（設計書 §13）。公開権限は
# RubyGems の API key で、リポジトリ Secrets `GEM_HOST_API_KEY` に登録する。
# user 側の初回公開手順（未取得の gem は **初回 push が所有権の取得** —
# `gem owner` は `--add` による追加 owner のみで、位置引数に user を
# 取る構文は存在しない）:
#   1. RubyGems.org アカウントを作成・`gem signin`
#   2. API key を発行（RubyGems.org → Profile → API Keys）し、
#      https://github.com/doridoridoriand/kuberails/settings/secrets/actions
#      の `GEM_HOST_API_KEY` に登録
#   3. `git tag v0.1.0 && git push origin v0.1.0` → この CI が初回 push する
# 以降 `gem owner kuberails --add <username>` で owner 追加が必要になったら
# そのコマンドを使う（--add は必須）。
#
# **tag 前に CHANGELOG.md を確定すること**: 本 workflow は CHANGELOG を
# 書き換えないため、tag 時点の内容がそのまま公開 gem に同梱される
# （「Unreleased」のまま tag すると未リリースとして公開される）。
#
# タグは gemspec の VERSION と一致させること（v0.1.0 / v0.2.0 / …）。
# 不一致なら build される gem の version とタグがズレるため CI で検出して fail。
name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 前提テスト: 宣言されたサポート Ruby（下限 3.3.0 = kruby 1.36.x の
  # required_ruby_version）の全バージョンで rake を通してからでないと公開しない。
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3.8", "3.3.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run rspec + rubocop
        run: bundle exec rake

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      # gemspec の VERSION とタグが一致していることを確認。
      - name: Check tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(ruby -e 'require_relative "lib/kuberails/version"; print KubeRails::VERSION')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match gemspec VERSION $VERSION"
            exit 1
          fi
          echo "tag=$TAG version=$VERSION — OK"

      - name: Build gem
        run: gem build kuberails.gemspec

      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: "${{ secrets.GEM_HOST_API_KEY }}"
        run: gem push $(ls kuberails-*.gem)
