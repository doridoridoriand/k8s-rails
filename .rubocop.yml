# Minimal rubocop configuration for M0.
# Full policy (line length, layout, project conventions) lands in M3.
AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false

# Rails convention: double-quoted strings (matches design doc examples / consumer app).
Style/StringLiterals:
  EnforcedStyle: double_quotes

# Test files are exempt from naming/metrics style cops (full policy lands in M3).
Naming/MethodParameterName:
  Exclude:
    - "spec/**/*"
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# The internal transport (Client#StringKeyedAdapter) and kruby's CustomObjectsApi
# use a fixed (group, version, namespace, plural, ...) signature — the patch
# variant legitimately carries 6 args. Exempt that method pair from the 5-arg rule.
Metrics/ParameterLists:
  Exclude:
    - "lib/kuberails/client.rb"
    - "spec/client_spec.rb"
